[project]
name = "agent-mem-search"
version = "0.1.0"
description = "Three-mode search (hierarchy / index-led LLM / BM25) over the agent-mem knowledge store."
authors = [{ name = "Nicholas Holden", email = "nicholas.holden@banqora.com" }]
requires-python = ">=3.12"
dependencies = [
    "rank-bm25>=0.2.2",
    "claude-agent-sdk>=0.1.29",
    "pyyaml>=6.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.26",
    # nomic-embed-text-v1.5 uses custom RoPE attention that depends on einops
    # for tensor reshaping. Stock transformers doesn't ship this transitively.
    "einops>=0.7",
]

[project.scripts]
agent-mem = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat module layout: cli.py, bm25.py, frontmatter.py live at package root.
only-include = ["cli.py", "bm25.py", "frontmatter.py", "embeddings.py", "aliases.py", "reranker.py"]
sources = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["E501", "C901", "PLR0912", "PLR0915", "PLC0415"]
"conftest.py" = ["E501", "C901", "PLR0912", "PLR0915", "PLC0415"]

[tool.pytest.ini_options]
addopts = "-ra --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
  "test_*.py",
  ".venv/*",
  "fixtures/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pyright]
include = ["bm25.py", "cli.py", "embeddings.py", "frontmatter.py", "aliases.py", "reranker.py"]
exclude = [".venv", "**/__pycache__", "build", "dist", "fixtures", "test_*.py", "conftest.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingImports = "warning"
reportUnusedImport = "error"
reportPrivateUsage = "warning"

[tool.pylint.similarities]
# Copy-paste detection (R0801) — the only pylint check we run; see the
# duplicate-code pre-commit hook. Tuned to flag genuine copy-paste while
# tolerating short, naturally-similar blocks (imports, signatures, etc).
min-similarity-lines = 8
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "pylint>=3.3",
]
