[project]
name = "agent-mem"
version = "0.1.0"
description = "Local, user-global memory store for coding agents — Phase 0 skeleton forked from claude-memory-compiler."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.29",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    # Shared utilities (project-bucket alias resolution, BM25 tokenizer/
    # indexer) used by both the daemon and the hook side. Pulled in as a
    # path dep so the hooks always see the same code the daemon does.
    "agent-mem-search",
]

[tool.uv.sources]
agent-mem-search = { path = "../tools/search", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "_dot_claude_disabled"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["E501"]

[tool.pyright]
include = ["hooks", "scripts"]
exclude = [".venv", "**/__pycache__", "build", "dist", "_dot_claude_disabled"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingImports = "warning"
# Hook and script files use sys.path manipulation at runtime to import sibling
# modules from src/scripts/ (e.g. `import config`, `import scope`). Adding the
# directories to extraPaths lets pyright resolve those imports without ignores.
extraPaths = ["hooks", "scripts"]

[tool.pytest.ini_options]
testpaths = ["hooks"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.409",
    "ruff>=0.15.14",
]
