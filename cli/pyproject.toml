[project]
name = "ultan"
version = "0.2.0"
description = "Ultan — local markdown memory for Claude Code (thin CLI + hooks + lazy daemon launcher)."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nicholas Holden", email = "nicholas.holden@banqora.com" }]
# Base deps are deliberately LIGHT — the thin entry-level wrapper. No torch.
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The heavy retrieval stack lives behind an extra and is provisioned on
# demand for the daemon — NOT pulled by the thin `uv tool install`.
# agent-mem-search carries sentence-transformers / numpy / einops.
retrieval = [
  "agent-mem-search",
]

[project.scripts]
ultan = "ultan.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ultan"]

[tool.uv.sources]
# Resolve the sibling from the workspace. The experiment is whether this
# survives a `uv tool install` straight from git.
agent-mem-search = { workspace = true }
