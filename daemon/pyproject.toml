[project]
name = "agent-mem-daemon"
version = "0.1.0"
description = "Long-running event-ingest daemon for agent-mem (Librarian + Scholar)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-mem" }]
# Runtime deps: Claude Agent SDK for Librarian/Scholar calls, rank-bm25 for
# dedup pre-computation (matches tools/search/bm25.py), pyyaml for parsing
# entry frontmatter when extracting the applies-when table.
#
# We intentionally depend on agent-mem-search (the tools/search package) as
# a path source so the daemon and CLI share one BM25 implementation. See
# the [tool.uv.sources] block below.
dependencies = [
  "claude-agent-sdk>=0.1.29",
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "json-repair>=0.25",
  "agent-mem-search",
  "opentelemetry-api>=1.42.0",
  # Markdown AST parsing for wikilink validation (skip code spans / code
  # fences natively). Don't rely on the transitive copy that ships with
  # claude-agent-sdk via rich — pin our own.
  "markdown-it-py>=4.0",
]

[project.scripts]
agent-mem-daemon = "agent_mem_daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_mem_daemon"]

[tool.uv.sources]
# Path dependency: the BM25 tokenizer/indexer lives in tools/search.
# Keeping it as a separate package lets the CLI and daemon share one
# implementation without copy-paste.
agent-mem-search = { path = "../tools/search", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pyright]
include = ["agent_mem_daemon", "tests"]
exclude = [".venv", "**/__pycache__", "build", "dist"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingImports = "warning"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.409",
    "ruff>=0.15.14",
]
