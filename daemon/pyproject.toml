[project]
name = "agent-mem-daemon"
version = "0.1.0"
description = "Long-running event-ingest daemon for agent-mem (Librarian + Scholar)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nicholas Holden", email = "nicholas.holden@banqora.com" }]
# Runtime deps: Pydantic AI powers both curator agents; rank-bm25 for dedup
# pre-computation (matches tools/search/bm25.py); pyyaml for parsing entry
# frontmatter when extracting the applies-when table.
#
# We intentionally depend on agent-mem-search (the tools/search package) as
# a path source so the daemon and CLI share one BM25 implementation. See
# the [tool.uv.sources] block below.
dependencies = [
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "agent-mem-search",
  "opentelemetry-api>=1.42.0",
  # Markdown AST parsing for wikilink validation (skip code spans / code
  # fences natively).
  "markdown-it-py>=4.0",
  # Pydantic AI powers both curator agents (Librarian + Scholar): typed
  # structured output (LibrarianProposal / ScholarDecisions), output
  # validators, and ModelRetry-driven self-correction. The [anthropic]
  # extra wires the Anthropic provider (anthropic:claude-*). 1.99+ is
  # required for compatibility with anthropic>=0.97 (the
  # UserLocation→BetaUserLocationParam rename); older pydantic-ai pins
  # import a symbol that no longer exists.
  "pydantic-ai-slim[anthropic]>=1.99",
]

[project.scripts]
agent-mem-daemon = "agent_mem_daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_mem_daemon"]

[tool.uv.sources]
# Path dependency: the BM25 tokenizer/indexer lives in tools/search.
# Keeping it as a separate package lets the CLI and daemon share one
# implementation without copy-paste.
agent-mem-search = { path = "../tools/search", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["agent_mem_daemon"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "C901", "PLR0912", "PLR0915", "PLC0415"]

[tool.pyright]
include = ["agent_mem_daemon"]
exclude = [".venv", "**/__pycache__", "build", "dist", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingImports = "warning"
reportUnusedImport = "error"
reportPrivateUsage = "warning"

[tool.pylint.similarities]
# Copy-paste detection (R0801) — the only pylint check we run; see the
# duplicate-code pre-commit hook. Tuned to flag genuine copy-paste while
# tolerating short, naturally-similar blocks (imports, signatures, etc).
min-similarity-lines = 8
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.409",
    "ruff>=0.15.14",
    "pytest-cov>=7.1.0",
    "pylint>=3.3",
]
